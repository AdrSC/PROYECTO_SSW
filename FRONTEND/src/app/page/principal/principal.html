<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style href="../../../styles.css"></style>
    <div class="access-header">
        <div class="brand-mark" >
            <!--imagen logo-->
        </div>
        <div class="brand-name">
            Electromatic
        </div>
        <div class="brand-caption">
            Sistema de ordenes de mantenimiento
        </div>
    </div>
</head>
<body>
    <main class="access-main">
        <div class="access-intro"> 
            <div>
                <span class="eyebrow">ACCESO POR ÁREA</span>
                <h1>Selecciona tu espacio de trabajo</h1>
            </div>
            <div class="order-context">
                <span>Ordenes Pendientes</span>
                <strong>0</strong>
                <small>Ordenes pendientes de atención</small>
            </div>
        </div>
        <div class="access-grid">
            <button class="access-card" routerLink="/cliente">
                <div class="access-card-top">
                    <span class="role-number">01</span>
                    <span class="role-status">DISPONIBLE</span><!--Cambio a futuro: Que se pueda cambiar el estado sin entrar directamente al html-->
                </div>
                <div class="access-card-title">
                    <h2>Cliente</h2>
                </div>
                <p>Registra tus datos, el equipo y el motivo de la solicitud</p>
                <span class="access-card-link">Acceder al área</span>
            </button>
            <button class="access-card">
                <div class="access-card-top">
                    <span class="role-number">02</span>
                    <span class="role-status">DISPONIBLE</span><!--Cambio a futuro: Que se pueda cambiar el estado sin entrar directamente al html-->
                </div>
                <div class="access-card-title">
                    <h2>Recepción</h2>
                </div>
                <p>Recibe el equipo, documenta su estado y asigna un técnico</p>
                <span class="access-card-link">Acceder al área</span>
            </button>
            <button class="access-card">
                <div class="access-card-top">
                    <span class="role-number">03</span>
                    <span class="role-status">DISPONIBLE</span><!--Cambio a futuro: Que se pueda cambiar el estado sin entrar directamente al html-->
                </div>
                <div class="access-card-title">
                    <h2>Técnico</h2>
                </div>
                <p>Realiza el diagnóstico y define el tipo de mantenimiento</p>
                <span class="access-card-link">Acceder al área</span>
            </button>
            <button class="access-card">
                <div class="access-card-top">
                    <span class="role-number">04</span>
                    <span class="role-status">DISPONIBLE</span><!--Cambio a futuro: Que se pueda cambiar el estado sin entrar directamente al html-->
                </div>
                <div class="access-card-title">
                    <h2>Administración</h2>
                </div>
                <p>Registra el pago, comprobante y condiciones de garantía</p>
                <span class="access-card-link">Acceder al área</span>
            </button>
            <button class="access-card">
                <div class="access-card-top">
                    <span class="role-number">05</span>
                    <span class="role-status">DISPONIBLE</span><!--Cambio a futuro: Que se pueda cambiar el estado sin entrar directamente al html-->
                </div>
                <div class="access-card-title">
                    <h2>Calidad</h2>
                </div>
                <p>Valida el funcionamiento y autoriza la entrega del equipo </p>
                <span class="access-card-link">Acceder al área</span>
            </button>
        </div>
    </main>
</body>
</html>
