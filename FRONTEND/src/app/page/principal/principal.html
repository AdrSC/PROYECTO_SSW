<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style href="principal.css"></style>
    <div class="access-header">
        <div class="brand-mark" >
            <!--imagen logo-->
        </div>
        <div class="brand-name">
            Electromatic
        </div>
        <div class="brand-caption">
            Sistema de ordenes de mantenimiento
        </div>
    </div>
</head>
<body>
    
    <header class="access-header">
        <div class="brand-mark">
            <!-- Imagen del logo -->
        </div>

        <div>
            <div class="brand-name">Electromatic</div>
            <div class="brand-caption">
                Sistema de órdenes de mantenimiento
            </div>
        </div>
    </header>

    <main class="access-main">

        <!-- Introducción y resumen -->
        <section class="access-intro">
            <div>
                <span class="eyebrow">ACCESO POR ÁREA</span>
                <h1>Selecciona tu espacio de trabajo</h1>
            </div>

            <div class="order-context">
                <span>Órdenes Pendientes</span>
                <strong id="principalOrdenesPendientes">0</strong>
                <small>Órdenes pendientes de atención</small>
            </div>
        </section>

        <!-- Espacios de trabajo -->
        <section class="access-grid">

            <!-- 01 CLIENTE -->
            <button class="access-card" routerLink="/cliente">
                <div class="access-card-top">
                    <span class="role-number">01</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Cliente</h2>
                </div>

                <p>
                    Registra tus datos, el equipo y el motivo de la solicitud.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

            <!-- 02 RECEPCIÓN -->
            <button class="access-card" routerLink="/recepcion">
                <div class="access-card-top">
                    <span class="role-number">02</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Recepción</h2>
                </div>

                <p>
                    Recibe el equipo, documenta su estado y asigna un técnico.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

            <!-- 03 TÉCNICO -->
            <button class="access-card" routerLink="/tecnico">
                <div class="access-card-top">
                    <span class="role-number">03</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Técnico</h2>
                </div>

                <p>
                    Realiza el diagnóstico y define el tipo de mantenimiento.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

            <!-- 04 ADMINISTRACIÓN -->
            <button class="access-card" routerLink="/administracion">
                <div class="access-card-top">
                    <span class="role-number">04</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Administración</h2>
                </div>

                <p>
                    Registra el pago, comprobante y condiciones de garantía.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

            <!-- 05 CONTROL DE CALIDAD -->
            <button class="access-card" routerLink="/calidad">
                <div class="access-card-top">
                    <span class="role-number">05</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Calidad</h2>
                </div>

                <p>
                    Valida el funcionamiento y autoriza la entrega del equipo.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

            <!-- 06 ALMACÉN -->
            <button class="access-card" routerLink="/almacen">
                <div class="access-card-top">
                    <span class="role-number">06</span>
                    <span class="role-status">DISPONIBLE</span>
                </div>

                <div class="access-card-title">
                    <h2>Almacén</h2>
                </div>

                <p>
                    Controla las existencias, gestiona repuestos y registra
                    los movimientos de materiales.
                </p>

                <span class="access-card-link">Acceder al área →</span>
            </button>

        </section>

    </main>
</body>
</html>
